name: Tauri Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: 'windows-latest'
            args: ''
            artifact_name: 'packimg-windows'
            asset_name: 'PackImg_${{ github.ref_name }}_windows_x64'
          # macOS Intel
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            artifact_name: 'packimg-macos-intel'
            asset_name: 'PackImg_${{ github.ref_name }}_macos_x64'
          # macOS Apple Silicon
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            artifact_name: 'packimg-macos-arm'
            asset_name: 'PackImg_${{ github.ref_name }}_macos_arm64'
          # Linux
          - platform: 'ubuntu-latest'
            args: ''
            artifact_name: 'packimg-linux'
            asset_name: 'PackImg_${{ github.ref_name }}_linux_x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Install macOS x86_64 Rust target
        if: runner.os == 'macOS' && matrix.args == '--target x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PackImg ${{ github.ref_name }}'
          releaseBody: |
            ## PackImg ${{ github.ref_name }}
            
            Empaquetado inteligente y eficiente de imágenes usando algoritmo MaxRects.
            
            ### Descargas:
            - **Windows**: Instalador NSIS (`.exe`) + MSI (`.msi`)
            - **macOS**: `.dmg` (Intel y Apple Silicon)
            - **Linux**: `.AppImage` y `.deb`
            
            ### Características:
            - Algoritmo MaxRects para empaquetado óptimo
            - 6 estrategias de ordenamiento
            - Rotación opcional (90°)
            - Padding configurable
            - Vista previa en tiempo real
            - Exportación a PNG
            - Modo oscuro/claro
            
            ### Verificación:
            Los archivos están firmados con checksums SHA256.
          args: ${{ matrix.args }}
          release: true
          prerelease: false

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  # Job adicional para generar checksums
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.msi" \) -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

      - name: Attach checksums to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}