<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PackImg - Empaquetado inteligente y eficiente de imágenes usando el algoritmo MaxRects"
    />
    <meta name="theme-color" content="#06090a" />
    <title>PackImg · Empaquetado Inteligente de Imágenes</title>
    <script>
      // Resolve the theme before first paint so the window never flashes the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem("packimg-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored ? stored === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
